name: Deploy Staging

on:
  push:
    branches: [main]

# The VPS follows main. A newer main push supersedes an older deployment.
concurrency:
  group: deploy-staging-ai-flow
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Prerequisite: add the corresponding public key to the Dokku server:
      #   dokku ssh-keys:add admin < ~/.ssh/id_ed25519.pub
      # See backend/DOKKU_DEPLOY.md for full setup.
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}

      - name: Trust Dokku host key
        run: ssh-keyscan -H docklight-staging.itman.fyi >> ~/.ssh/known_hosts

      - name: Deploy to Dokku
        shell: bash
        run: |
          git remote add dokku dokku@docklight-staging.itman.fyi:ai-flow
          # Cancellation can leave the previous server-side build finishing.
          # Wait for its lock; never unlock an app while it may still deploy.
          for attempt in {1..20}; do
            if git push --force dokku HEAD:main 2>&1 | tee /tmp/dokku-deploy.log; then
              break
            fi
            if ! grep -qi 'deploy lock' /tmp/dokku-deploy.log || [ "$attempt" -eq 20 ]; then
              exit 1
            fi
            sleep 30
          done

      - name: Verify deployed revision and health
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          # git:report reads repository HEAD, which can point at another branch.
          deployed_sha=$(ssh dokku@docklight-staging.itman.fyi config:get ai-flow GIT_REV)
          printf 'Deployed revision: %s\n' "$deployed_sha"
          test "$deployed_sha" = "$EXPECTED_SHA"
          ssh dokku@docklight-staging.itman.fyi ps:report ai-flow
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            https://ai-flow-staging.itman.fyi/api/health
